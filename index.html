<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI教育场景工作台 · 可点击演示原型</title>
<style>
  :root{
    --bg:#f3f6fb;
    --surface:#ffffff;
    --surface-2:#fafcff;
    --primary:#2f6bff;
    --primary-soft:#eaf1ff;
    --primary-deep:#1d4ed8;
    --accent:#0fb8a6;
    --accent-soft:#e3f8f4;
    --warn:#f59e0b;
    --warn-soft:#fff3e0;
    --danger:#ef4444;
    --text:#1f2937;
    --muted:#6b7280;
    --faint:#9aa3b2;
    --border:#e6ebf3;
    --border-strong:#d4dce8;
    --shadow:0 6px 22px rgba(31,52,95,.08);
    --shadow-sm:0 2px 8px rgba(31,52,95,.06);
    --radius:14px;
    --radius-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select,textarea{font-family:inherit;font-size:14px}
  a{color:var(--primary);text-decoration:none}

  /* ============ Layout ============ */
  .topbar{
    height:64px;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:40;box-shadow:var(--shadow-sm);
  }
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer}
  .brand .logo{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg,var(--primary),#5b8bff);
    display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(47,107,255,.35);
  }
  .brand .title{font-weight:700;font-size:16px;letter-spacing:.3px}
  .brand .title small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:1.5px}
  .demo-badge{
    font-size:11px;color:var(--warn);background:var(--warn-soft);
    border:1px solid #ffe0a3;padding:3px 9px;border-radius:20px;font-weight:600;
  }
  .roleswitch{display:flex;background:var(--bg);padding:4px;border-radius:12px;gap:4px}
  .roleswitch button{
    padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);
    transition:.2s;white-space:nowrap;
  }
  .roleswitch button.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow-sm)}
  .roleswitch button:hover:not(.active){color:var(--text)}
  .top-actions{display:flex;align-items:center;gap:10px}
  .btn-ghost{
    border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);
    padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;transition:.2s;
  }
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}

  .layout{display:flex;min-height:calc(100vh - 64px)}
  .sidebar{
    width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:18px 14px;position:sticky;top:64px;height:calc(100vh - 64px);overflow-y:auto;
  }
  .nav-group-label{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:1px;margin:6px 8px 8px}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    color:var(--muted);font-size:14px;font-weight:600;margin-bottom:3px;transition:.18s;cursor:pointer;
    border:1px solid transparent;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--primary-soft);color:var(--primary);border-color:#d4e2ff}
  .nav-item.back{color:var(--faint);font-weight:500;font-size:13px}
  .nav-item.back:hover{color:var(--danger)}

  .main{flex:1;padding:26px 30px 60px;overflow-x:hidden}
  .page{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:18px}
  .page-head h1{font-size:23px;font-weight:800;letter-spacing:.3px}
  .page-head .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--primary);text-transform:uppercase}

  /* ============ Value strip (痛点-功能-产出-价值) ============ */
  .value-strip{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px;
    background:linear-gradient(120deg,#f7faff,#eef4ff);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;
  }
  .value-strip .vs{padding:0 12px;border-left:2px solid var(--border-strong)}
  .value-strip .vs:first-child{border-left:none;padding-left:0}
  .value-strip .vs h4{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px;letter-spacing:.5px}
  .value-strip .vs p{font-size:13px;color:var(--text);font-weight:600;line-height:1.5}
  .value-strip .vs .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;margin-bottom:6px}
  .tag-pain{background:#ffeaea;color:#d6334b}
  .tag-func{background:var(--primary-soft);color:var(--primary)}
  .tag-out{background:var(--accent-soft);color:#0a8c7e}
  .tag-val{background:#fff3e0;color:#c47a00}

  /* ============ Cards ============ */
  .grid{display:grid;gap:18px}
  .grid-3{grid-template-columns:repeat(3,1fr)}
  .grid-2{grid-template-columns:repeat(2,1fr)}
  .sub-cards{display:grid;grid-template-columns:1fr;gap:10px;margin-top:4px}
  .sub-card{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:.18s;cursor:pointer}
  .sub-card:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
  .sub-card .sc-name{font-weight:700;font-size:14px;color:var(--text)}
  .sub-card .sc-pain{font-size:12px;color:var(--muted);margin:4px 0 8px;line-height:1.5}
  .sub-card .sc-go{font-size:12px;font-weight:700;color:var(--primary)}
  .grid-auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow-sm);transition:.22s;
  }
  .card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
  .card.click{cursor:pointer}
  .card .ic{
    width:46px;height:46px;border-radius:12px;display:grid;place-items:center;margin-bottom:14px;
    background:var(--primary-soft);color:var(--primary);
  }
  .card .ic svg{width:24px;height:24px}
  .card h3{font-size:16px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .card .pain{font-size:13px;color:var(--muted);line-height:1.55;margin-bottom:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .chip{font-size:11.5px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:4px 9px;border-radius:7px}
  .chip.accent{color:#0a8c7e;background:var(--accent-soft)}
  .enter-btn{
    width:100%;background:var(--primary);color:#fff;padding:11px;border-radius:10px;
    font-size:14px;font-weight:700;transition:.2s;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .enter-btn:hover{background:var(--primary-deep)}
  .enter-btn svg{width:16px;height:16px}

  /* ============ Forms ============ */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .panel-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .panel-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:9px}
  .panel-head .ic{width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
  .panel-head .ic svg{width:18px;height:18px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:20px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.full{grid-column:1/-1}
  .field label{font-size:12.5px;font-weight:700;color:var(--muted)}
  .field label .req{color:var(--danger)}
  .field input,.field select,.field textarea{
    border:1px solid var(--border-strong);border-radius:9px;padding:10px 12px;font-size:14px;color:var(--text);
    background:var(--surface-2);transition:.18s;width:100%;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft);
  }
  .field textarea{resize:vertical;min-height:70px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{
    padding:8px 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);
    font-size:13px;font-weight:600;color:var(--muted);transition:.18s;
  }
  .seg button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .seg button:hover:not(.active){border-color:var(--primary);color:var(--primary)}
  .gen-row{padding:0 20px 20px;display:flex;gap:10px;align-items:center}
  .btn-primary{
    background:var(--primary);color:#fff;padding:12px 22px;border-radius:10px;font-size:14.5px;font-weight:700;
    transition:.2s;display:flex;align-items:center;gap:8px;
  }
  .btn-primary:hover{background:var(--primary-deep)}
  .btn-primary:disabled{opacity:.7;cursor:wait}
  .btn-line{
    border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:11px 16px;
    border-radius:10px;font-size:13.5px;font-weight:600;transition:.18s;
  }
  .btn-line:hover{border-color:var(--primary);color:var(--primary)}
  .btn-line.accent{border-color:var(--accent);color:var(--accent)}
  .btn-line.accent:hover{background:var(--accent-soft)}

  /* ============ Result area ============ */
  .result{margin-top:18px}
  .result-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .verify-badge{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
    background:var(--warn-soft);color:#b9760a;border:1px solid #ffe0a3;padding:5px 11px;border-radius:20px;
  }
  .verify-badge svg{width:14px;height:14px}
  .tone-seg{display:flex;gap:6px}
  .tone-seg button{padding:7px 13px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--muted)}
  .tone-seg button.active{background:var(--primary-soft);color:var(--primary);border-color:#cfe0ff}
  .result-body{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
  .result-body h4{font-size:14px;font-weight:700;margin:14px 0 7px;color:var(--primary-deep)}
  .result-body h4:first-child{margin-top:0}
  .result-body p{font-size:14px;color:var(--text);margin-bottom:8px}
  .result-body ul{margin:0 0 8px 20px}
  .result-body li{font-size:13.5px;margin-bottom:5px}
  .result-body .quote{background:#fff;border-left:3px solid var(--primary);padding:10px 14px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text);margin-bottom:8px}

  .facts{background:#fff;border:1px dashed var(--border-strong);border-radius:10px;padding:14px 16px;margin-top:14px}
  .facts h5{font-size:13px;font-weight:700;color:var(--warn);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .fact-item{display:flex;align-items:flex-start;gap:9px;font-size:13px;margin-bottom:7px}
  .fact-item svg{width:16px;height:16px;color:var(--warn);flex-shrink:0;margin-top:2px}
  .fact-item .ok{color:var(--accent)}
  .result-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  .loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px;color:var(--muted)}
  .spinner{width:34px;height:34px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .empty{text-align:center;padding:46px 20px;color:var(--faint)}
  .empty svg{width:54px;height:54px;margin-bottom:12px;opacity:.5}

  /* ============ Table / search / notes ============ */
  .photo-entry{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
  .ocr-ok{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--accent-soft);border:1px solid #bdeedd;border-radius:10px;padding:10px 12px;margin-top:8px}
  .ocr-ok svg{width:15px;height:15px;color:var(--accent);flex-shrink:0;margin-top:1px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
  th,td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--border)}
  th{background:var(--surface-2);font-weight:700;color:var(--muted);font-size:12.5px;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .src-note{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 15px;margin-top:14px;display:flex;gap:9px;align-items:flex-start}
  .src-note svg{width:16px;height:16px;color:var(--warn);flex-shrink:0;margin-top:2px}

  /* ============ Parent flow ============ */
  .flow-steps{display:flex;gap:0;margin-bottom:20px;flex-wrap:wrap}
  .flow-steps .step{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);font-size:13px;font-weight:600;color:var(--muted)}
  .flow-steps .step:first-child{border-radius:10px 0 0 10px}
  .flow-steps .step:last-child{border-radius:0 10px 10px 0}
  .flow-steps .step .n{width:22px;height:22px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700}
  .flow-steps .step.on{color:var(--primary);border-color:var(--primary)}
  .flow-steps .step.on .n{background:var(--primary);color:#fff}
  .warn-card{background:#fff8ec;border:1px solid #ffe2b0;border-radius:10px;padding:13px 16px;font-size:13px;color:#9a6400;display:flex;gap:9px;margin-bottom:16px}
  .warn-card svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--text);color:#fff;padding:13px 22px;border-radius:12px;font-size:14px;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.3s;z-index:100;display:flex;align-items:center;gap:9px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:18px;height:18px;color:var(--accent)}

  /* ============ Modal ============ */
  .modal-mask{position:fixed;inset:0;background:rgba(20,30,55,.5);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
  .modal-mask.show{display:flex}
  .modal{background:var(--surface);border-radius:16px;max-width:680px;width:100%;max-height:84vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-head h3{font-size:18px;font-weight:800}
  .modal-close{font-size:22px;color:var(--faint);width:34px;height:34px;border-radius:9px;display:grid;place-items:center}
  .modal-close:hover{background:var(--bg);color:var(--text)}
  .modal-body{padding:22px}
  .modal-body h4{font-size:14px;color:var(--primary);margin:16px 0 7px;font-weight:700}
  .modal-body h4:first-child{margin-top:0}
  .modal-body p,.modal-body li{font-size:13.5px;color:var(--text)}
  .modal-body ol,.modal-body ul{margin:0 0 6px 20px}
  .modal-body li{margin-bottom:5px}
  .modal-body .time{font-size:12px;color:var(--faint);font-weight:700;float:right}
  .script-kpi{display:flex;gap:12px;margin-bottom:8px}
  .script-kpi .k{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
  .script-kpi .k b{display:block;font-size:18px;color:var(--primary)}
  .script-kpi .k span{font-size:11.5px;color:var(--muted)}

  .water-mark{position:fixed;bottom:8px;right:12px;font-size:11px;color:var(--faint);z-index:5;pointer-events:none}

  @media(max-width:980px){
    .sidebar{display:none}
    .grid-3,.grid-2{grid-template-columns:1fr}
    .value-strip{grid-template-columns:1fr 1fr}
    .roleswitch{overflow-x:auto}
    .roleswitch button{padding:8px 11px;font-size:12.5px}
    .main{padding:18px 16px 50px}
    .form-grid{grid-template-columns:1fr}
  }
</style>
</head>

/* ===================== RENDER ===================== */
const $ = s=>document.querySelector(s);
const main = ()=>$('#main');
const sidebar = ()=>$('#sidebar');

function go(sec, sub){
  state.section = sec;
  if(sec==='teacher'){ state.teacher = sub||'home'; }
  if(sec==='parent'){ state.parent = sub||'home'; state.parentKey=null; state.parentHTML=''; }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function render(){
  // role switch highlight
  document.querySelectorAll('#roleswitch button').forEach(b=>{
    b.classList.toggle('active', b.dataset.sec===state.section);
  });
  renderSidebar();
  const map = {
    overview:renderOverview, teacher:renderTeacher,     parent:renderParent
  };
  main().innerHTML = `<div class="page">${map[state.section]()}</div>`;
  // 还原家长端已生成的辅导结果（切换分层 / 重渲染时不丢失）
  if(state.section==='parent' && state.parentKey && state.parentHTML){
    const el=document.querySelector('#parentResult');
    if(el) el.innerHTML=state.parentHTML;
  }
  bindPage();
}

/* ---------- Sidebar ---------- */
function renderSidebar(){
  let items='';
  const back='<div class="nav-item back" onclick="go(\'overview\')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回总览</div>';
  const head=(t)=>`<div class="nav-group-label">${t}</div>`;
  if(state.section==='overview'){
    items = head('两类场景工具')+
      navItem('teacher','i-teacher','教师端 · 提效','teacher')+
      navItem('parent','i-parent','家长端 · 辅导','parent');
  } else if(state.section==='teacher'){
    items = head('教师AI工作台')+
      navItem('home','i-home','工作台首页','teacher','home')+
      navItem('prep','i-book','备课生成','teacher','prep')+
      navItem('grading','i-grade','智能批改','teacher','grading')+
      navItem('meeting','i-chat','家长会发言稿','teacher','meeting')+
      navItem('homework','i-edit','作业讲评稿','teacher','homework')+
      navItem('pcomm','i-lock','家长沟通','teacher','pcomm')+
      navItem('comment','i-edit','评语生成','teacher','comment')+
      navItem('cmgmt','i-tools','班级管理','teacher','cmgmt')+
      navItem('library','i-template','模板与素材库','teacher','library')+
      back;
  } else if(state.section==='parent'){
    let cats='';
    PARENT_CATEGORIES.forEach(c=>{
      cats += head(c.name+' · '+c.desc);
      c.scenarios.forEach(sk=>{
        const s=PARENT_SCENARIOS[sk];
        cats += navItem(sk, c.icon, s.name, 'parent', sk);
      });
    });
    items = head('家长AI辅导教练')+
      navItem('phome','i-parent','辅导首页','parent','home')+
      cats + back;
  }
  sidebar().innerHTML = items;
}
function navItem(sec,icon,label,realSec,sub){
  let active=false;
  if(realSec===state.section){
    if(sub) active = (state[realSec]===sub);
    else active = (realSec==='teacher') ? (state.teacher==='home') : (state[realSec]===sec);
  }
  const onClick = sub? `go('${realSec}','${sub}')` : `go('${sec}')`;
  return `<div class="nav-item ${active?'active':''}" onclick="${onClick}"><svg><use href="#${icon}"/></svg>${label}</div>`;
}

function qrSVG(){
  const n=13, cell=8, pad=10, size=n*cell+pad*2;
  let r='', seed=7;
  const rnd=()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return (seed>>16)&1; };
  const finder=(x,y)=>{
    r+=`<rect x="${pad+x*cell}" y="${pad+y*cell}" width="${cell*3}" height="${cell*3}" fill="#1f2937"/>`;
    r+=`<rect x="${pad+(x+1)*cell}" y="${pad+(y+1)*cell}" width="${cell}" height="${cell}" fill="#fff"/>`;
  };
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const inF=(i<4&&j<4)||(i>n-5&&j<4)||(i<4&&j>n-5);
    if(inF) continue;
    if(rnd()) r+=`<rect x="${pad+i*cell}" y="${pad+j*cell}" width="${cell}" height="${cell}" fill="#1f2937"/>`;
  }
  finder(0,0); finder(n-3,0); finder(0,n-3);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border-radius:12px;border:1px solid var(--border)">${r}</svg>`;
}
